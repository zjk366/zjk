<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src blob: attachment: *; script-src 'self' 'unsafe-eval' 'unsafe-inline' *; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' *; font-src 'self' data: *; img-src 'self' data: file: cs-vfs: attachment: * blob:; media-src 'self' file: cs-vfs: attachment:; frame-src * file:" />
    <title>黑洞</title>

    <style>
      html,
      body {
        margin: 0;
        background: #0a0e1a;
      }

      #spinner {
        position: fixed;
        width: 100vw;
        height: 100vh;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        display: flex;
        background: radial-gradient(ellipse at center, #0f1a30 0%, #0a0e1a 70%);
      }

      #spinner img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        animation: blackholeSpin 20s linear infinite, blackholePulse 4s ease-in-out infinite;
        box-shadow: 0 0 20px rgba(22, 119, 255, 0.4),
                    0 0 60px rgba(22, 119, 255, 0.2),
                    0 0 100px rgba(22, 119, 255, 0.1);
      }

      #spinner::after {
        content: '黑洞';
        margin-top: 30px;
        color: rgba(200, 220, 240, 0.8);
        font-size: 18px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        letter-spacing: 4px;
      }

      @keyframes blackholeSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes blackholePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      @keyframes accretionSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="spinner">
      <img src="/src/assets/images/blackhole.png" />
    </div>
    <script>
      console.time('init')
    </script>
    <script type="module" src="/src/init.ts"></script>
    <script type="module" src="/src/entryPoint.tsx"></script>
  </body>
</html>
